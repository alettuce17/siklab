    <script>
        // ============================================================
        // SIKLAB CLOUD BRIDGE
        //
        // This game stays isolated inside the Teacher Dashboard iframe.
        // Controller input arrives from the dashboard through postMessage.
        // Audio commands are sent back to the dashboard through postMessage.
        // Questions/history use the parent's Supabase client when available.
        // ============================================================

        function requestControllerCommand(player, command) {
            const normalizedPlayer =
                player === 'p1' ? 'player1' :
                player === 'p2' ? 'player2' :
                player;

            if (!['player1', 'player2'].includes(normalizedPlayer)) {
                console.warn('[SikLab] Invalid controller player:', player);
                return;
            }

            const allowed = [
                'g1correct',
                'g1wrong',
                'g1track1',
                'g1track2',
                'track1',
                'track2'
            ];

            if (!allowed.includes(command)) {
                console.warn('[SikLab] Invalid controller command:', command);
                return;
            }

            // The game is expected to be hosted on the same Netlify origin
            // as the Teacher Dashboard. js/11_esp32.js receives this message
            // and invokes the Supabase controller-command Edge Function.
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'controller_command',
                    player: normalizedPlayer,
                    command
                }, window.location.origin);
            } else {
                console.warn('[SikLab] Game is not inside the SikLab dashboard iframe.');
            }
        }

        function getSikLabSupabase() {
            try {
                if (window.parent !== window && window.parent.supabaseClient) {
                    return window.parent.supabaseClient;
                }
            } catch (error) {
                console.warn('[SikLab] Could not access parent Supabase client:', error);
            }

            return window.supabaseClient || null;
        }

        async function resolveGameSchoolYearId() {
            const params = new URLSearchParams(window.location.search);
            const fromUrl = Number(params.get('school_year_id') || params.get('year') || 0);
            if (Number.isSafeInteger(fromUrl) && fromUrl > 0) return fromUrl;

            try {
                const parentYear = Number(window.parent?.currentSchoolYearId || 0);
                if (Number.isSafeInteger(parentYear) && parentYear > 0) return parentYear;
            } catch (_) {}

            const db = getSikLabSupabase();
            if (!db) return null;
            const { data } = await db.from('school_years')
                .select('year_id')
                .eq('is_active', true)
                .maybeSingle();
            return Number(data?.year_id || 0) || null;
        }

        const HARDWARE_BUTTONS = [
            { id: 0, name: 'A', hex: '#ef4444', bgClass: 'bg-red-500 text-white border-white', icon: 'fa-a' },
            { id: 1, name: 'B', hex: '#22c55e', bgClass: 'bg-green-500 text-white border-white', icon: 'fa-b' },
            { id: 2, name: 'C', hex: '#ffffff', bgClass: 'bg-white text-slate-800 border-slate-300', icon: 'fa-c' },
            { id: 3, name: 'D', hex: '#3b82f6', bgClass: 'bg-blue-500 text-white border-white', icon: 'fa-d' },
            { id: 4, name: 'E', hex: '#eab308', bgClass: 'bg-yellow-500 text-white border-white', icon: 'fa-e' }
        ];

        function renderDynamicControllers() {
            const positions = ['col-start-2', 'col-start-1', 'col-start-3', 'col-start-1 ml-4 mt-1', 'col-start-3 mr-4 mt-1'];
            const p1 = document.getElementById('p1-buttons-container');
            const p2 = document.getElementById('p2-buttons-container');
            HARDWARE_BUTTONS.forEach((btn, index) => {
                const pos = positions[index];
                const html = `<div class="flex flex-col items-center ${pos}"><button onmousedown="handleActionDown('pX', ${btn.id})" onmouseup="handleActionUp('pX', ${btn.id})" onmouseleave="handleActionUp('pX', ${btn.id})" ontouchstart="handleActionDown('pX', ${btn.id}); event.preventDefault();" ontouchend="handleActionUp('pX', ${btn.id}); event.preventDefault();" class="w-12 h-12 ${btn.bgClass} rounded-full shadow-md hover:scale-105 transition-transform border-2"><i class="fa-solid ${btn.icon}"></i></button><span class="text-[10px] font-bold text-slate-400 mt-2 uppercase">${btn.name}</span></div>`;
                p1.innerHTML += html.replace(/pX/g, 'p1'); p2.innerHTML += html.replace(/pX/g, 'p2');
            });
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameLoopId;
        
        let gameState = 'MENU'; 
        let scores = { p1: 0, p2: 0 };
        
        // Input Tracking
        const KEYS = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false, '1': false, '2': false, '3': false, '4': false, '5': false, '7': false, '8': false, '9': false, '0': false, '-': false };
        const BTNS = { p1: [false,false,false,false,false], p2: [false,false,false,false,false] };
        const BTNS_PRESSED_THIS_FRAME = { p1: [false,false,false,false,false], p2: [false,false,false,false,false] };

        window.addEventListener('keydown', (e) => {
            // Audio debugging is available through the on-screen debugger buttons.
            // No letter shortcuts are used because W/A/S/D are Player 1 movement keys.
            if (KEYS.hasOwnProperty(e.key)) {
                KEYS[e.key] = true;
                if (gameState !== 'MENU') {
                    const map = {'1':['p1',0], '2':['p1',1], '3':['p1',2], '4':['p1',3], '5':['p1',4], '7':['p2',0], '8':['p2',1], '9':['p2',2], '0':['p2',3], '-':['p2',4]};
                    if (map[e.key] && !BTNS[map[e.key][0]][map[e.key][1]]) {
                        handleActionDown(map[e.key][0], map[e.key][1]);
                    }
                }
            }
        });
        window.addEventListener('keyup', (e) => {
            if (KEYS.hasOwnProperty(e.key)) {
                KEYS[e.key] = false;
                const map = {'1':['p1',0], '2':['p1',1], '3':['p1',2], '4':['p1',3], '5':['p1',4], '7':['p2',0], '8':['p2',1], '9':['p2',2], '0':['p2',3], '-':['p2',4]};
                if(map[e.key]) handleActionUp(map[e.key][0], map[e.key][1]);
            }
        });

        function handleActionDown(player, btnId) { BTNS[player][btnId] = true; BTNS_PRESSED_THIS_FRAME[player][btnId] = true; }
        function handleActionUp(player, btnId) { BTNS[player][btnId] = false; }

        // ============================================================
        // ESP32 INPUT
        // The virtual controllers remain fully active.
        // Physical ESP32 input follows one path only:
        // ESP32 -> Supabase Edge Function -> Realtime -> Dashboard -> postMessage -> Game
        // ============================================================
        let latestESP32State = {
            p1: "000000000",
            p2: "000000000"
        };
        const ESP_BTNS_HELD = {
            p1: [false, false, false, false, false],
            p2: [false, false, false, false, false]
        };

        window.addEventListener('message', (event) => {
            // Only accept messages from the same SikLab origin.
            if (event.origin !== window.location.origin) {
                return;
            }

            // When this game is inside the dashboard iframe,
            // controller input must come from its parent dashboard.
            if (window.parent !== window && event.source !== window.parent) {
                return;
            }

            const data = event.data;

            if (!data || data.type !== 'esp32_input') {
                return;
            }

            const raw = data.player;
            const player =
                raw === 'player1'
                    ? 'p1'
                    : raw === 'player2'
                        ? 'p2'
                        : raw;

            if (player !== 'p1' && player !== 'p2') {
                console.warn('[ESP32] Invalid player ignored:', raw);
                return;
            }

            const state = String(data.state ?? '');

            if (!/^[01]{9}$/.test(state)) {
                console.warn('[ESP32] Invalid controller state ignored:', state);
                return;
            }

            latestESP32State[player] = state;
        });

        // --- DRAGGABLE VIRTUAL JOYSTICK LOGIC ---
        function initJoystick(baseId, knobId, keys) {
            const base = document.getElementById(baseId);
            const knob = document.getElementById(knobId);
            let active = false;
            let maxDist = 35; 

            function updateKnob(clientX, clientY) {
                const rect = base.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                let dx = clientX - centerX;
                let dy = clientY - centerY;
                let dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }
                
                knob.style.transform = `translate(${dx}px, ${dy}px)`;

                const threshold = 15;
                KEYS[keys.up] = dy < -threshold;
                KEYS[keys.down] = dy > threshold;
                KEYS[keys.left] = dx < -threshold;
                KEYS[keys.right] = dx > threshold;
            }

            function resetKnob() {
                active = false;
                knob.style.transform = `translate(0px, 0px)`;
                knob.style.transition = 'transform 0.1s ease-out';
                KEYS[keys.up] = false;
                KEYS[keys.down] = false;
                KEYS[keys.left] = false;
                KEYS[keys.right] = false;
            }

            base.addEventListener('mousedown', e => { 
                active = true; 
                knob.style.transition = 'none'; 
                updateKnob(e.clientX, e.clientY); 
            });
            window.addEventListener('mousemove', e => { 
                if(active) updateKnob(e.clientX, e.clientY); 
            });
            window.addEventListener('mouseup', e => { 
                if(active) resetKnob(); 
            });

            base.addEventListener('touchstart', e => { 
                e.preventDefault(); 
                active = true; 
                knob.style.transition = 'none'; 
                updateKnob(e.touches[0].clientX, e.touches[0].clientY); 
            }, {passive: false});
            
            window.addEventListener('touchmove', e => { 
                if(active) {
                    e.preventDefault(); 
                    updateKnob(e.touches[0].clientX, e.touches[0].clientY); 
                }
            }, {passive: false});
            
            window.addEventListener('touchend', e => { 
                if(active) resetKnob(); 
            });
        }

        initJoystick('p1-joystick-base', 'p1-joystick-knob', {up:'w', down:'s', left:'a', right:'d'});
        initJoystick('p2-joystick-base', 'p2-joystick-knob', {up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight'});

        let p1Name = "PLAYER 1"; let p1Short = "P1"; let p1Members = "";
        let p2Name = "PLAYER 2"; let p2Short = "P2"; let p2Members = "";
        let p1Participant = null;
        let p2Participant = null;

        try {
            const savedP1 = localStorage.getItem('siklab_active_p1');
            if (savedP1) { 
                const d = JSON.parse(savedP1);
                p1Participant = d;
                p1Name = String(d.name || 'Player 1').toUpperCase();

        function clampNumber(value, fallback, min, max) {
            const n = Number(value);
            if (!Number.isFinite(n)) return fallback;
            return Math.min(max, Math.max(min, n));
        }

        function normalizeW1Settings(raw = {}) {
            return {
                basePoints: clampNumber(raw.basePoints, DEFAULT_W1_SETTINGS.basePoints, 0, 1000),
                deduction: clampNumber(raw.deduction, DEFAULT_W1_SETTINGS.deduction, 0, 1000),
                stunDelay: clampNumber(raw.stunDelay, DEFAULT_W1_SETTINGS.stunDelay, 0, 30),
                retryMultiplier: clampNumber(raw.retryMultiplier, DEFAULT_W1_SETTINGS.retryMultiplier, 0, 1),
                roundTimer: clampNumber(raw.roundTimer, DEFAULT_W1_SETTINGS.roundTimer, 1, 600)
            };
        }

            };

                    .select('session_id')

                    .from('player_score')
                    .insert({
                        session_id: sessionId,
                        final_score: Math.max(scores.p1, scores.p2),
                        custom_game_data: historyData
                    });

                }
                if (p2StudentId) {

                    const { error: scoreError } = await db.from('player_score').insert(scoreRows);

                    localStorage.getItem('siklab_history') || '[]'

        function triggerShake(intensity) { screenShake = intensity; }

        // ---------- VISUAL EFFECTS: CONFETTI PARTICLES + SCREEN FLASH ----------
        let particles = [];
        let screenFlash = { color: null, alpha: 0 };

        function spawnConfetti(x, y, colors, count = 45) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 7;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 5, // initial upward pop
                    size: 4 + Math.random() * 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.4,
                    life: 1,
                    decay: 0.008 + Math.random() * 0.012
                });
            }
        }

        function triggerFlash(color, peakAlpha = 0.32) {
            screenFlash = { color, alpha: peakAlpha };
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.vy += 0.18; // gravity
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.rotSpeed;
                p.life -= p.decay;
                if (p.life <= 0 || p.y > canvas.height + 50) particles.splice(i, 1);
            }
            if (screenFlash.alpha > 0) screenFlash.alpha = Math.max(0, screenFlash.alpha - 0.03);
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                ctx.restore();
            });

            if (screenFlash.alpha > 0 && screenFlash.color) {
                ctx.save();
                ctx.globalAlpha = screenFlash.alpha;
                ctx.fillStyle = screenFlash.color;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            }
        }

        function updatePhysics() {
            const now = Date.now();
            const resetPresses = () => { for(let i=0;i<5;i++){ BTNS_PRESSED_THIS_FRAME.p1[i]=false; BTNS_PRESSED_THIS_FRAME.p2[i]=false; } };
            
            // Physical input is tracked separately so it never overwrites keyboard/virtual input.
            ['p1', 'p2'].forEach(p => {
                const s = latestESP32State[p];
                for (let i = 0; i < 5; i++) {
                    const isPressed = s[4 + i] === '1';
                    if (isPressed && !ESP_BTNS_HELD[p][i]) {
                        BTNS_PRESSED_THIS_FRAME[p][i] = true;
                    }
                    ESP_BTNS_HELD[p][i] = isPressed;
                }
            });

            if (gameState === 'GAMEOVER') return resetPresses();

            if (gameState === 'PLAYING_RPS') {
                if (mgData.rps.resultTimer > 0) {
                    mgData.rps.resultTimer--;
                    if (mgData.rps.resultTimer <= 0) {
                        if (mgData.rps.resultText.includes("TIE")) {
                            mgData.rps.p1Choice = null;
                            mgData.rps.p2Choice = null;
                            mgData.rps.resultText = "";
                        } else {
                            startNextRound();
                        }
                    }
                    return resetPresses();
                }

                if (mgData.rps.p1Choice === null) {
                    if (BTNS_PRESSED_THIS_FRAME.p1[0]) mgData.rps.p1Choice = 0; 
                    if (BTNS_PRESSED_THIS_FRAME.p1[1]) mgData.rps.p1Choice = 1; 
                    if (BTNS_PRESSED_THIS_FRAME.p1[2]) mgData.rps.p1Choice = 2; 
                }
                if (mgData.rps.p2Choice === null) {
                    if (BTNS_PRESSED_THIS_FRAME.p2[0]) mgData.rps.p2Choice = 0; 
                    if (BTNS_PRESSED_THIS_FRAME.p2[1]) mgData.rps.p2Choice = 1; 
                    if (BTNS_PRESSED_THIS_FRAME.p2[2]) mgData.rps.p2Choice = 2; 
                }

                if (mgData.rps.p1Choice !== null && mgData.rps.p2Choice !== null) {
                    const c1 = mgData.rps.p1Choice;
                    const c2 = mgData.rps.p2Choice;
                    if (c1 === c2) {
                        mgData.rps.resultText = "TIE! SHOOT AGAIN!";
                        mgData.rps.resultTimer = 90; 
                        triggerShake(5);
                    } else if ((c1 === 0 && c2 === 2) || (c1 === 1 && c2 === 0) || (c1 === 2 && c2 === 1)) {
                        mgData.rps.resultText = p1Short + " WINS CAMERA!";
                        mgData.cameraController = 'p1';
                        mgData.rps.resultTimer = 120; 
                    } else {
                        mgData.rps.resultText = p2Short + " WINS CAMERA!";
                        mgData.cameraController = 'p2';
                        mgData.rps.resultTimer = 120; 
                    }
                }
                return resetPresses();
            }

            if (mgData.animating) {
                mgData.roundEndTime += (now - lastFrameTime); 
                if (now > mgData.animEndTime) startNextRound();
                lastFrameTime = now;
                return resetPresses();
            }

            let panLeft = false, panRight = false, zoomIn = false, zoomOut = false;
            
            if (mgData.cameraController === 'p1') {
                if (KEYS.a || latestESP32State.p1[2] === '1') panLeft = true;
                if (KEYS.d || latestESP32State.p1[3] === '1') panRight = true;
                if (KEYS.w || latestESP32State.p1[0] === '1') zoomIn = true;
                if (KEYS.s || latestESP32State.p1[1] === '1') zoomOut = true;
            } else if (mgData.cameraController === 'p2') {
                if (KEYS.ArrowLeft || latestESP32State.p2[2] === '1') panLeft = true;
                if (KEYS.ArrowRight || latestESP32State.p2[3] === '1') panRight = true;
                if (KEYS.ArrowUp || latestESP32State.p2[0] === '1') zoomIn = true;
                if (KEYS.ArrowDown || latestESP32State.p2[1] === '1') zoomOut = true;
            }

            if (panLeft) mgData.imgX -= 5;
            if (panRight) mgData.imgX += 5;
            if (zoomIn) mgData.imgScale += 0.02;
            if (zoomOut) mgData.imgScale -= 0.02;

            mgData.imgScale = Math.max(1.0, Math.min(3.0, mgData.imgScale));

            const maxPanX = (360 * mgData.imgScale - 360) / 2;
            const maxPanY = (240 * mgData.imgScale - 240) / 2;
            mgData.imgX = Math.max(-maxPanX, Math.min(maxPanX, mgData.imgX));
            mgData.imgY = Math.max(-maxPanY, Math.min(maxPanY, mgData.imgY));

            const timeLeft = mgData.roundEndTime - now;
            if (timeLeft <= 0) {
                mgData.animating = true; mgData.winner = 'tie';
                mgData.animEndTime = now + 2000;
                showFeedback('tie', "TIME'S UP!");
                lastFrameTime = now;
                return resetPresses();
            }

            if (mgData.p1StunMs > 0) {
                mgData.p1StunMs -= (now - lastFrameTime);
                if (mgData.p1StunMs <= 0) {
                    mgData.p1StunMs = 0;
                    mgData.currentPointPool = Math.max(0, mgData.currentPointPool - dSettings.deduction);
                }
            }
            if (mgData.p2StunMs > 0) {
                mgData.p2StunMs -= (now - lastFrameTime);
                if (mgData.p2StunMs <= 0) {
                    mgData.p2StunMs = 0;
                    mgData.currentPointPool = Math.max(0, mgData.currentPointPool - dSettings.deduction);
                }
            }

            const penalty = (player) => {
                mgData.attempts[player]++;
                if(player==='p1') mgData.p1StunMs = dSettings.stunDelay * 1000; 
                if(player==='p2') mgData.p2StunMs = dSettings.stunDelay * 1000; 
                triggerShake(10);
                triggerFlash('#ef4444', 0.3);
                updateUI();
                
                // TELL HARDWARE TO PLAY WRONG SOUND
                requestControllerCommand(player, 'g1wrong');
            };

            const reward = (player) => {
                mgData.winner = player;
                mgData.animating = true;
                mgData.animEndTime = now + 2000; 
                
                let pointsEarned = mgData.currentPointPool;
                if (mgData.attempts[player] > 0) {
                    pointsEarned = Math.floor(mgData.currentPointPool * dSettings.retryMultiplier);
                }
                
                scores[player] += pointsEarned;
                triggerShake(5);
                triggerFlash('#10b981', 0.22);
                const winColors = player === 'p1' ? ['#3b82f6', '#93c5fd', '#facc15', '#ffffff'] : ['#ef4444', '#fca5a5', '#facc15', '#ffffff'];
                spawnConfetti(player === 'p1' ? 250 : 750, 350, winColors, 60);
                updateUI();
                showFeedback(player, `${player === 'p1' ? p1Short : p2Short} GOT IT!`, pointsEarned);

                // TELL HARDWARE TO PLAY CORRECT SOUND
                requestControllerCommand(player, 'g1correct');
            };

            const rewardTie = () => {
                mgData.winner = 'tie';
                mgData.animating = true;
                mgData.animEndTime = now + 2000; 
                
                let p1Pts = mgData.attempts.p1 > 0 ? Math.floor(mgData.currentPointPool * dSettings.retryMultiplier) : mgData.currentPointPool;
                let p2Pts = mgData.attempts.p2 > 0 ? Math.floor(mgData.currentPointPool * dSettings.retryMultiplier) : mgData.currentPointPool;
                
                scores.p1 += p1Pts;
                scores.p2 += p2Pts;
                
                triggerShake(10);
                triggerFlash('#facc15', 0.28);
                spawnConfetti(250, 350, ['#3b82f6', '#93c5fd', '#facc15', '#ffffff'], 45);
                spawnConfetti(750, 350, ['#ef4444', '#fca5a5', '#facc15', '#ffffff'], 45);
                updateUI();
                showFeedback('tie', "PERFECT TIE! BOTH SCORE!");

                // TELL BOTH HARDWARE CONTROLLERS TO PLAY CORRECT SOUND
                requestControllerCommand('player1', 'g1correct');
                requestControllerCommand('player2', 'g1correct');
            };

            let p1Correct = false, p1Wrong = false;
            let p2Correct = false, p2Wrong = false;

            [0, 1, 2, 3, 4].forEach(btnIdx => {
                if (BTNS_PRESSED_THIS_FRAME.p1[btnIdx] && mgData.p1StunMs === 0) {
                    if (btnIdx === mgData.current.ans) p1Correct = true; else p1Wrong = true;
                }
                if (BTNS_PRESSED_THIS_FRAME.p2[btnIdx] && mgData.p2StunMs === 0) {
                    if (btnIdx === mgData.current.ans) p2Correct = true; else p2Wrong = true;
                }
            });

            if (p1Wrong) penalty('p1');
            if (p2Wrong) penalty('p2');

            if (p1Correct && !p1Wrong && p2Correct && !p2Wrong) {
                rewardTie();
            } else if (p1Correct && !p1Wrong) {
                reward('p1');
            } else if (p2Correct && !p2Wrong) {
                reward('p2');
            }

            if (screenShake > 0) screenShake--;
            updateParticles();
            lastFrameTime = now;
            resetPresses();
        }

        function drawGame() {
            if (gameState === 'MENU' || gameState === 'GAMEOVER') return;

            ctx.save();
            if (screenShake > 0) ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);

            if (gameState === 'PLAYING_RPS') {
                ctx.fillStyle = '#fff7ed'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffedd5'; ctx.fillRect(20, 20, canvas.width-40, canvas.height-40);
                
                ctx.fillStyle = '#ea580c'; ctx.font = 'bold 50px detective-font'; ctx.textAlign = 'center';
                ctx.fillText("ROCK PAPER SCISSORS!", 500, 100);
                ctx.fillStyle = '#1e293b'; ctx.font = 'bold 20px Poppins';
                ctx.fillText("Winner gets to control the Camera! (BTNS 1, 2, or 3)", 500, 140);

                ctx.fillStyle = '#eff6ff'; ctx.beginPath(); ctx.roundRect(50, 180, 420, 450, 20); ctx.fill();
                ctx.lineWidth = 4; ctx.strokeStyle = '#bfdbfe'; ctx.stroke();
                ctx.fillStyle = '#1d4ed8'; ctx.font = 'bold 36px Poppins'; ctx.fillText(p1Name, 260, 230);
                
                if (mgData.rps.p1Choice === null) {
                    ctx.fillStyle = '#3b82f6'; ctx.font = 'bold 20px Poppins';
                    ctx.fillText("WAITING FOR INPUT...", 260, 320);
                    ctx.fillStyle = '#93c5fd'; ctx.beginPath(); ctx.roundRect(110, 380, 300, 200, 10); ctx.fill();
                    ctx.fillStyle = '#1e3a8a';
                    ctx.fillText("BTN 1 = 🪨 ROCK", 260, 430);
                    ctx.fillText("BTN 2 = 📄 PAPER", 260, 480);
                    ctx.fillText("BTN 3 = ✂️ SCISSORS", 260, 530);
                } else if (mgData.rps.p2Choice === null) {
                    ctx.fillStyle = '#10b981'; ctx.font = 'bold 40px Poppins';
                    ctx.fillText("READY!", 260, 420);
                } else {
                    const emojis = ['🪨', '📄', '✂️'];
                    ctx.font = '150px Arial'; ctx.fillText(emojis[mgData.rps.p1Choice], 260, 420);
                }

                ctx.fillStyle = '#fef2f2'; ctx.beginPath(); ctx.roundRect(530, 180, 420, 450, 20); ctx.fill();
                ctx.lineWidth = 4; ctx.strokeStyle = '#fecaca'; ctx.stroke();
                ctx.fillStyle = '#b91c1c'; ctx.font = 'bold 36px Poppins'; ctx.fillText(p2Name, 740, 230);
                
                if (mgData.rps.p2Choice === null) {
                    ctx.fillStyle = '#ef4444'; ctx.font = 'bold 20px Poppins';
                    ctx.fillText("WAITING FOR INPUT...", 740, 320);
                    ctx.fillStyle = '#fca5a5'; ctx.beginPath(); ctx.roundRect(590, 380, 300, 200, 10); ctx.fill();
                    ctx.fillStyle = '#7f1d1d';
                    ctx.fillText("BTN 1 = 🪨 ROCK", 740, 430);
                    ctx.fillText("BTN 2 = 📄 PAPER", 740, 480);
                    ctx.fillText("BTN 3 = ✂️ SCISSORS", 740, 530);
                } else if (mgData.rps.p1Choice === null) {
                    ctx.fillStyle = '#10b981'; ctx.font = 'bold 40px Poppins';
                    ctx.fillText("READY!", 740, 420);
                } else {
                    const emojis = ['🪨', '📄', '✂️'];
                    ctx.font = '150px Arial'; ctx.fillText(emojis[mgData.rps.p2Choice], 740, 420);
                }

                if (mgData.rps.resultText !== "") {
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)'; ctx.beginPath(); ctx.roundRect(100, 300, 800, 160, 20); ctx.fill();
                    ctx.fillStyle = '#fde047'; ctx.font = 'bold 60px detective-font'; ctx.fillText(mgData.rps.resultText, 500, 380);
                }
                
                ctx.restore();
                return; 
            }

            ctx.fillStyle = '#fff7ed'; ctx.fillRect(0, 0, canvas.width, canvas.height); 
            ctx.fillStyle = '#ffedd5'; ctx.fillRect(20, 20, canvas.width-40, canvas.height-40);
            
            const cx = 500;
            const now = Date.now();
            
            ctx.fillStyle = mgData.cameraController === 'p1' ? '#3b82f6' : '#ef4444';
            ctx.beginPath(); ctx.roundRect(350, 20, 300, 40, 10); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Poppins'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const controllerName = mgData.cameraController === 'p1' ? p1Short : p2Short;
            ctx.fillText(`📷 ${controllerName} CONTROLS CAMERA`, 500, 40);

            ctx.fillStyle = '#f1f5f9'; ctx.fillRect(50, 70, 900, 20);
            const timeLeft = Math.max(0, mgData.roundEndTime - now);
            const timeRatio = timeLeft / mgData.roundDurationMs;
            
            ctx.fillStyle = timeRatio > 0.3 ? '#10b981' : '#ef4444';
            ctx.fillRect(50, 70, 900 * timeRatio, 20);

            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(800, 100, 150, 50, 10); ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#fed7aa'; ctx.stroke();
            ctx.fillStyle = '#ea580c'; ctx.font = 'bold 24px Poppins'; ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText(`${mgData.currentPointPool} PTS`, 875, 125);

            ctx.fillStyle = '#ffffff'; ctx.shadowColor = 'rgba(0,0,0,0.05)'; ctx.shadowBlur = 15; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 10;
            ctx.beginPath(); ctx.rotate(-Math.PI/128); ctx.roundRect(cx - 200, 120, 400, 300, 20); ctx.fill();
            ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
            
            ctx.save();
            ctx.clip(); 
            
            ctx.translate(cx, 270); 
            ctx.scale(mgData.imgScale, mgData.imgScale);

            if (currentLoadedImage) {
                ctx.drawImage(currentLoadedImage, -180 + (mgData.imgX / mgData.imgScale), -140 + (mgData.imgY / mgData.imgScale), 360, 240);
            } else {
                ctx.fillStyle = '#f8fafc'; ctx.fillRect(-180, -140, 360, 240);
                ctx.fillStyle = '#cbd5e1'; ctx.font = '60px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('🕹️', mgData.imgX / mgData.imgScale, mgData.imgY / mgData.imgScale - 20);
            }

            ctx.restore();
            ctx.restore();

            ctx.save();
            ctx.fillStyle = '#ffffff'; 
            ctx.shadowColor = 'rgba(0,0,0,0.05)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;
            ctx.beginPath(); ctx.roundRect(100, 450, 800, 120, 20); ctx.fill();
            ctx.strokeStyle = '#ffedd5'; ctx.lineWidth = 2; ctx.stroke();
            ctx.shadowColor = 'transparent';
            
            ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(500, 460, 8, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(498, 458, 3, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#1e293b'; ctx.font = 'bold 28px detective-font'; ctx.textAlign = 'center'; ctx.textBaseline='middle';
            const prompt = mgData.current.prompt;
            if(prompt.length > 40) {
                const words = prompt.split(' ');
                const mid = Math.ceil(words.length / 2);
                ctx.fillText(words.slice(0,mid).join(' '), cx, 500);
                ctx.fillText(words.slice(mid).join(' '), cx, 540);
            } else {
                ctx.fillText(prompt, cx, 510);
            }
            ctx.restore();

            ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.roundRect(0, 600, canvas.width, 100, [0, 0, 20, 20]); ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.beginPath(); ctx.moveTo(0,600); ctx.lineTo(canvas.width, 600); ctx.stroke();

            ctx.fillStyle = 'rgba(30, 41, 59, 0.9)'; ctx.fillRect(0, 620, canvas.width, 80);
            HARDWARE_BUTTONS.forEach((btn, idx) => {
                const x = 150 + idx * 175;
                
                // Draw pill background
                ctx.fillStyle = btn.hex; 
                ctx.beginPath(); 
                ctx.roundRect(x - 30, 640, 60, 30, 5); 
                ctx.fill();
                
                // If it's the white 'C' button, add a border so it doesn't blend in
                if (btn.name === 'C') {
                    ctx.strokeStyle = '#94a3b8'; 
                    ctx.lineWidth = 2; 
                    ctx.stroke();
                    ctx.fillStyle = '#1e293b'; // Dark text inside pill
                } else {
                    ctx.fillStyle = '#ffffff'; // White text inside pill
                }

                // Draw inside pill text
                ctx.font = 'bold 14px Poppins'; 
                ctx.textAlign = 'center'; 
                ctx.textBaseline = 'middle'; 
                ctx.fillText(btn.name, x, 655);
                
                // Draw bottom text (A, B, C, D, E)
                // Use a dark color for C so it shows up on the light background
                ctx.fillStyle = btn.name === 'C' ? '#94a3b8' : btn.hex; 
                ctx.font = 'bold 18px detective-font'; 
                ctx.fillText(btn.name, x, 685);
            });

            if (mgData.p1StunMs > 0) { ctx.fillStyle = 'rgba(239,68,68,0.4)'; ctx.fillRect(0,0,500,canvas.height); ctx.fillStyle='#ef4444'; ctx.font='bold 50px Poppins'; ctx.fillText(`${p1Short} STUNNED!`, 250, 350); }
            if (mgData.p2StunMs > 0) { ctx.fillStyle = 'rgba(239,68,68,0.4)'; ctx.fillRect(500,0,500,canvas.height); ctx.fillStyle='#ef4444'; ctx.font='bold 50px Poppins'; ctx.fillText(`${p2Short} STUNNED!`, 750, 350); }

            drawParticles();
        }

        function gameLoop() {
            if (gameState.startsWith('PLAYING')) updatePhysics();
            if (gameState !== 'MENU') drawGame();
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function makeDraggable(elmntId) {
            const elmnt = document.getElementById(elmntId);
            const handle = elmnt.querySelector('.drag-handle');
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            handle.onmousedown = dragMouseDown; handle.ontouchstart = dragTouchStart;
            function dragMouseDown(e) { e.preventDefault(); pos3 = e.clientX; pos4 = e.clientY; document.onmouseup = closeDragElement; document.onmousemove = elementDrag; }
            function dragTouchStart(e) { pos3 = e.touches[0].clientX; pos4 = e.touches[0].clientY; document.ontouchend = closeDragElement; document.ontouchmove = elementTouchDrag; }
            function elementDrag(e) { e.preventDefault(); pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY; pos3 = e.clientX; pos4 = e.clientY; elmnt.style.bottom="auto"; elmnt.style.right="auto"; elmnt.style.top=(elmnt.offsetTop-pos2)+"px"; elmnt.style.left=(elmnt.offsetLeft-pos1)+"px"; }
            function elementTouchDrag(e) { pos1 = pos3 - e.touches[0].clientX; pos2 = pos4 - e.touches[0].clientY; pos3 = e.touches[0].clientX; pos4 = e.touches[0].clientY; elmnt.style.bottom="auto"; elmnt.style.right="auto"; elmnt.style.top=(elmnt.offsetTop-pos2)+"px"; elmnt.style.left=(elmnt.offsetLeft-pos1)+"px"; }
            function closeDragElement() { document.onmouseup = null; document.onmousemove = null; document.ontouchend = null; document.ontouchmove = null; }
        }
        
        let controllersVisible = false;
        function toggleControllers() {
            controllersVisible = !controllersVisible;
            document.getElementById('controller-p1').style.display = controllersVisible ? 'block' : 'none';
            document.getElementById('controller-p2').style.display = controllersVisible ? 'block' : 'none';
        }

        renderDynamicControllers();
        makeDraggable('controller-p1'); 
        makeDraggable('controller-p2');
        lastFrameTime = Date.now();
        gameLoopId = requestAnimationFrame(gameLoop); 
    </script>
</body>
</html>
